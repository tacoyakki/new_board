<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a2232"><title>게시글 — Demomo</title><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"></head>
<body class="boards-page"><div class="noise"></div><button id="heroWrite" hidden></button>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">D</span><span>demomo</span></a><nav class="nav"><a href="/">홈</a><a class="active" href="/boards.html">게시글</a><a href="/#about">소개</a></nav><div class="header-actions"><button class="icon-button" id="searchToggle" aria-label="검색 열기"><span class="search-icon"></span></button><button class="button ghost" id="authButton">로그인</button><button class="button primary" id="writeButton">＋ 글쓰기</button></div></header>
<main><section class="board-hero"><p class="section-kicker">COMMUNITY NIGHT SKY</p><h1>오늘 밤, 어떤 이야기가<br><em>떠오르고 있을까요?</em></h1><p>사람들의 생각 사이를 천천히 여행해보세요.</p></section><section class="content-shell" id="feed"><div class="section-head"><div><p class="section-kicker">ALL STORIES</p><h2>새로운 이야기</h2></div><div class="feed-tools"><label class="search-field" id="searchField"><span class="search-icon"></span><input id="searchInput" type="search" placeholder="이야기 검색" aria-label="게시글 검색"></label><select id="sortSelect"><option value="new">최신순</option><option value="views">조회순</option><option value="comments">댓글순</option></select></div></div><div class="post-grid" id="postGrid"></div><div class="empty-state hidden" id="emptyState"><div>✦</div><h3>아직 이야기가 없어요</h3><p>이 밤하늘의 첫 번째 별이 되어주세요.</p><button class="button primary" data-open-write>이야기 시작하기</button></div></section></main>
<footer><a class="brand" href="/"><span class="brand-mark">D</span><span>demomo</span></a><p>생각이 별이 되는 순간.</p><span>© 2026 DEMOMO</span></footer>
<div class="modal-layer" id="authModal" aria-hidden="true"><div class="modal auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><button class="close-button" data-close aria-label="닫기">×</button><div class="modal-symbol">D</div><p class="section-kicker">WELCOME</p><h2 id="authTitle">다시 만나 반가워요.</h2><p class="modal-copy">계속해서 이야기를 나눠볼까요?</p><div class="auth-tabs"><button class="active" data-auth-tab="login">로그인</button><button data-auth-tab="signup">회원가입</button></div><form id="authForm"><label>아이디<input name="username" autocomplete="username" required minlength="3" placeholder="아이디를 입력하세요"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="4" placeholder="비밀번호를 입력하세요"></label><button class="button primary wide" type="submit">로그인</button></form><p class="form-hint">처음이신가요? <button type="button" data-switch-auth>회원가입</button></p></div></div>
<div class="modal-layer" id="writeModal" aria-hidden="true"><div class="modal write-modal" role="dialog" aria-modal="true" aria-labelledby="writeTitle"><button class="close-button" data-close aria-label="닫기">×</button><p class="section-kicker">NEW STORY</p><h2 id="writeTitle">무슨 생각을 하고 있나요?</h2><form id="writeForm"><label>제목<input name="title" required maxlength="80" placeholder="이야기의 제목을 적어주세요"><span class="counter"><b id="titleCount">0</b>/80</span></label><label>내용<textarea name="content" required maxlength="3000" rows="10" placeholder="완벽하게 쓰지 않아도 괜찮아요. 지금의 생각을 편하게 들려주세요."></textarea></label><div class="form-actions"><button type="button" class="button ghost" data-close>취소</button><button type="submit" class="button primary">이야기 올리기 ↗</button></div></form></div></div>
<div class="drawer-layer" id="detailLayer" aria-hidden="true"><button class="drawer-backdrop" data-close aria-label="닫기"></button><article class="detail-drawer" id="detailDrawer"></article></div><div class="toast" id="toast"></div><script src="/app.js" defer></script></body></html>
